version: 2

models:
  - name: fct_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
  - name: dim_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

exposures:
  - name: customer_report
    type: dashboard
    owner:
      name: Analytics
    depends_on:
      - ref('dim_customers')
