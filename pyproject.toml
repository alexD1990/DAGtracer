[project]
name = "dagtrace"
version = "0.1.0"
description = "dbt Row-Level Lineage Tracer"
requires-python = ">=3.10"
dependencies = [
    "sqlglot",
    "pyyaml",
]

[project.scripts]
dgt = "rowtrace.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]